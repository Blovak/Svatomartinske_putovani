<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#263d36">
  <meta name="description" content="Mapa zastavení Svatomartinského putování">
  <title>Svatomartinské putování</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="./style.css?v=6">
  <link rel="stylesheet" href="./point-status.css?v=4">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script defer src="./config.js?v=3"></script>
  <script type="module" src="./app.js?v=6"></script>
</head>
<body>
  <div id="map" aria-label="Mapa míst putování"></div>
  <header class="brand-panel">
    <span class="brand-mark" aria-hidden="true">✦</span>
    <div><small>Podzimní cesta</small><h1>Svatomartinské putování</h1></div>
  </header>
  <section class="location-panel" aria-label="Ovládání polohy">
    <p id="location-info">Čekám na polohu…</p>
    <button id="locate" type="button">Moje poloha</button>
  </section>
  <div class="map-legend" aria-label="Legenda mapy"><span><i class="legend-dot point-location" aria-hidden="true"></i>Místo putování</span><span><i class="legend-dot user-location" aria-hidden="true"></i>Vaše poloha</span></div>
  <div id="status" role="status" aria-live="polite"></div>
  <section id="setup" class="notice" hidden><h2>Je potřeba doplnit připojení</h2><p>Správce musí nastavit URL nasazeného Apps Scriptu v souboru <code>config.js</code>. Postup je v README.</p></section>
</body>
</html>
